<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>dingdong | 포트폴리오</title>
  <meta name="description" content="프론트엔드 개발을 공부하는 dingdong의 포트폴리오">
  <style>
    :root {
      color-scheme: light;
      font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      color: #202525;
      background: #f6f6ef;
      --muted: #525d58;
      --line: #d3d8cd;
      --accent: #cbedaa;
    }

    * { box-sizing: border-box; }
    body { margin: 0; }
    h1, h2, h3, p { margin: 0; }
    a { color: #285239; text-underline-offset: .25em; }
    a:focus-visible { outline: 2px solid #285239; outline-offset: 4px; }

    .page {
      width: min(100% - 2rem, 66rem);
      margin-inline: auto;
    }

    .hero {
      margin-top: clamp(1rem, 5vw, 4rem);
      padding: clamp(1.4rem, 7vw, 5rem);
      border-radius: 1.25rem;
      background: #1d2d28;
      color: #fff;
    }

    h1 {
      color: var(--accent);
      font-family: "Arial Black", "Helvetica Neue", sans-serif;
      font-size: clamp(2.65rem, 10vw, 7rem);
      font-weight: 900;
      letter-spacing: -.075em;
      line-height: 1;
      overflow-wrap: anywhere;
    }

    .hero p {
      margin-top: 1.1rem;
      max-width: 36ch;
      font-size: clamp(1rem, 2.2vw, 1.3rem);
      line-height: 1.7;
      word-break: keep-all;
    }

    section, footer { padding-block: clamp(1.5rem, 4vw, 2.5rem); }
    section + section, footer { border-top: 1px solid var(--line); }
    h2 { margin-bottom: 1rem; font-size: 1.25rem; }

    .interests p { font-size: clamp(1.35rem, 3.5vw, 2rem); font-weight: 700; }

    .projects {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 1rem;
    }

    .card {
      display: flex;
      flex-direction: column;
      gap: .7rem;
      min-height: 11rem;
      padding: clamp(1rem, 3vw, 1.6rem);
      border: 1px solid var(--line);
      border-radius: 1rem;
      background: #fff;
    }

    .card.planned { background: transparent; border-style: dashed; }
    .card h3 { font-size: 1.15rem; }
    .card p { color: var(--muted); line-height: 1.65; word-break: keep-all; }
    .card .project-link { margin-top: auto; padding-top: .5rem; font-size: .875rem; }

    .skills, .contacts {
      display: flex;
      flex-wrap: wrap;
      gap: .6rem;
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .skills li {
      padding: .45rem .85rem;
      border-radius: 999px;
      background: var(--accent);
      color: #1d2d28;
      font-weight: 700;
    }

    .contacts { column-gap: 1.5rem; color: var(--muted); }
    .contacts li { overflow-wrap: anywhere; }

    @media (max-width: 36rem) {
      .projects { grid-template-columns: 1fr; }
      .card { min-height: auto; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="hero">
      <h1>dingdong</h1>
      <p>HTML, CSS, JavaScript를 배우며 작은 웹 프로젝트를 만들고 있어요.</p>
    </header>

    <main>
      <section class="interests" aria-labelledby="interests-heading">
        <h2 id="interests-heading">관심사</h2>
        <p>프론트엔드 개발</p>
      </section>

      <section aria-labelledby="projects-heading">
        <h2 id="projects-heading">프로젝트</h2>
        <div class="projects">
          <article class="card">
            <h3>GitHub Pages 사용하기</h3>
            <p>GitHub Pages로 HTML과 CSS로 만든 웹페이지를 배포하는 실습입니다.</p>
            <!-- 주소가 생기면 아래 span을 <a href="프로젝트주소">프로젝트 보기</a>로 바꾸세요. -->
            <p class="project-link"><span>링크 추가 예정</span></p>
          </article>

          <!-- 두 번째 프로젝트가 생기면 제목과 설명을 바꾸고 class에서 planned를 지우세요. -->
          <article class="card planned">
            <h3>추가 예정</h3>
            <p>다음 프로젝트를 시작하면 여기에 소개할게요.</p>
            <!-- 주소가 생기면 아래 span을 <a href="프로젝트주소">프로젝트 보기</a>로 바꾸세요. -->
            <p class="project-link"><span>링크 추가 예정</span></p>
          </article>
        </div>
      </section>

      <section aria-labelledby="skills-heading">
        <h2 id="skills-heading">스킬</h2>
        <ul class="skills">
          <li>HTML</li>
          <li>CSS</li>
          <li>JavaScript</li>
        </ul>
      </section>
    </main>

    <footer aria-labelledby="contact-heading">
      <h2 id="contact-heading">연락처</h2>
      <ul class="contacts">
        <!-- 이메일을 공개할 때 아래 span을 <a href="mailto:이메일주소">이메일주소</a>로 바꾸세요. -->
        <li>이메일 · <span>추가 예정</span></li>
        <!-- 프로필을 공개할 때 아래 span을 <a href="https://github.com/사용자이름">GitHub 프로필</a>로 바꾸세요. -->
        <li>GitHub · <span>추가 예정</span></li>
      </ul>
    </footer>
  </div>
</body>
</html>
